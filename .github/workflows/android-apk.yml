name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;27.2.12479018'
          accept-android-sdk-licenses: true

      - name: Install workload and tools
        run: |
          dotnet workload install android
          dotnet tool restore

      - name: Build APK
        run: >
          dotnet build MuAndroid/MuAndroid.csproj -c Release -f net10.0-android
          -p:AndroidSdkDirectory=$env:ANDROID_SDK_ROOT
          -p:AcceptAndroidSdkLicenses=true

      - name: Publish APK
        run: >
          dotnet publish MuAndroid/MuAndroid.csproj -c Release -f net10.0-android
          -o publish-android
          -p:AndroidSdkDirectory=$env:ANDROID_SDK_ROOT
          -p:AcceptAndroidSdkLicenses=true

      - name: Package APK
        run: Compress-Archive -Path publish-android\*.apk -DestinationPath muonline-android.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mu-android-apk
          if-no-files-found: error
          path: muonline-android.zip
