name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;27.2.12479018'
          accept-android-sdk-licenses: true

      - name: Install workload and tools
        run: |
          dotnet workload install android
          dotnet tool restore

      - name: Build APK
        run: >
          dotnet build MuAndroid/MuAndroid.csproj -c Release -f net11.0-android
          -p:AndroidSdkDirectory=$env:ANDROID_SDK_ROOT
          -p:AcceptAndroidSdkLicenses=true

      - name: Publish APK
        run: >
          dotnet publish MuAndroid/MuAndroid.csproj -c Release -f net11.0-android
          -o publish-android
          -p:AndroidSdkDirectory=$env:ANDROID_SDK_ROOT
          -p:AcceptAndroidSdkLicenses=true

      - name: Sign APK with stable key
        shell: pwsh
        run: |
          $apksigner = Join-Path $env:ANDROID_SDK_ROOT "build-tools\35.0.0\apksigner.bat"
          $apk = Get-ChildItem publish-android -Filter *.apk | Select-Object -First 1
          if (-not $apk) { throw "No APK found in publish-android" }
          & $apksigner sign --ks .ci/mu.keystore --ks-key-alias mu --ks-pass pass:mu123456 --key-pass pass:mu123456 --out publish-android\MuMono-release.apk $apk.FullName
          if ($LASTEXITCODE -ne 0) { throw "apksigner sign failed" }
          Get-ChildItem publish-android -Filter *.apk | Where-Object { $_.Name -ne 'MuMono-release.apk' } | Remove-Item -Force
          & $apksigner verify --print-certs publish-android\MuMono-release.apk

      - name: Package APK
        run: Compress-Archive -Path publish-android\*.apk -DestinationPath muonline-android.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mu-android-apk
          if-no-files-found: error
          path: muonline-android.zip
